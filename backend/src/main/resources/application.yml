server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

spring:
  application:
    name: danger-emergence-backend

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
        transport:
          protocol: smtp
  
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/danger_emergence}
    username: ${DB_USERNAME:${DB_USER:postgres}}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    open-in-view: false
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  
  redis:
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 16
        max-idle: 8
        min-idle: 4
  
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

# FCM Push Notification Configuration (Firebase Cloud Messaging HTTP v1 API)
# Uses OAuth2 with a Firebase Admin SDK service account JSON file.
# Download the JSON file from Firebase Console -> Project Settings -> Service Accounts
# Then place it on your server and set FCM_SERVICE_ACCOUNT_PATH to its location.
fcm:
  service-account-path: ${FCM_SERVICE_ACCOUNT_PATH:/etc/secrets/firebase-service-account.json}
  api-url: https://fcm.googleapis.com/v1/projects/${FCM_PROJECT_ID:volunteercoin}/messages:send

# SMS Gateway Configuration (Twilio)
sms:
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    from-number: ${TWILIO_FROM_NUMBER:}
    api-url: https://api.twilio.com/2010-04-01/Accounts/%s/Messages.json

# Paystack Payment Gateway Configuration
paystack:
  secret-key: ${PAYSTACK_SECRET_KEY:}
  api-url: https://api.paystack.co
  callback-url: ${APP_BASE_URL:https://sectop.resultscaleai.com}/payment/callback

# ML Service Configuration
ml:
  service:
    url: ${ML_SERVICE_URL:http://localhost:8000}
    api-key: ${ML_API_KEY:}
    timeout: 30000
    model: bart-emergency

# Predictive ML Cache Configuration
predictive:
  cache:
    ttl:
      forecast: 300        # 5 minutes for area forecasts
      hotspot: 120         # 2 minutes for hotspot detections
      batch: 600           # 10 minutes for batch forecasts

# MQTT Configuration
mqtt:
  broker: ${MQTT_BROKER:tcp://localhost:1883}
  client-id: danger-emergence-backend
  topic-prefix: danger/emergence/

# Logging
logging:
  level:
    com.dangeremergence: INFO
    org.springframework: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - traceId=%X{traceId:-} spanId=%X{spanId:-} %msg%n"
  file:
    name: logs/danger-emergence.log
    max-size: 10MB
    max-history: 7
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 500MB
# Structured JSON Logging is configured via logback-spring.xml
# See src/main/resources/logback-spring.xml for Logstash encoder setup
    version: 1.0.0

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,heapdump,threaddump
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
    metrics:
      enabled: true
  health:
    redis:
      enabled: true
    db:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
        step: 30s
    tags:
      application: ${spring.application.name}
      environment: ${APP_ENV:development}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      sla:
        http.server.requests: 10ms, 50ms, 100ms, 200ms, 500ms, 1s, 5s
      minimum-expected-value:
        http.server.requests: 1ms
      maximum-expected-value:
        http.server.requests: 30s

# OpenTelemetry
otel:
  service.name: danger-emergence-backend
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
      timeout: 30s
  traces:
    sampler: parentbased_traceidratio
    sampler.arg: ${OTEL_TRACES_SAMPLER_ARG:0.1}
  resource:
    attributes:
      deployment.environment: ${APP_ENV:development}
      service.version: 1.0.0

# Async Configuration
spring.task.execution:
  pool:
    core-size: 5
    max-size: 10
    queue-capacity: 100
  thread-name-prefix: async-

# Scheduled Tasks
scheduling:
  cleanup:
    messages-cron: "0 0 3 * * ?"   # Daily at 3 AM
    alerts-cron: "0 0/30 * * * ?"   # Every 30 minutes
    zones-cron: "0 0 4 * * ?"       # Daily at 4 AM
    deletion-cron: "0 0 3 * * ?"    # Daily at 3 AM (account deletion grace period)
