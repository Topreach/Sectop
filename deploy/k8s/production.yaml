# Danger Emergence System - Kubernetes Production Deployment
# Multi-region, zero-downtime, disaster-resistant architecture

---
apiVersion: v1
kind: Namespace
metadata:
  name: danger-emergence

---
# ConfigMap for application configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: danger-emergence
data:
  DB_HOST: "postgres-primary.danger-emergence.svc.cluster.local"
  DB_PORT: "5432"
  REDIS_HOST: "redis.danger-emergence.svc.cluster.local"
  REDIS_PORT: "6379"
  MQTT_BROKER: "tcp://mosquitto.danger-emergence.svc.cluster.local:1883"
  ML_SERVICE_URL: "http://ml-service.danger-emergence.svc.cluster.local:8000"
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.danger-emergence.svc.cluster.local:4317"
  OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
  OTEL_TRACES_SAMPLER_ARG: "0.1"
  OTEL_SERVICE_NAME: "danger-emergence-backend"
  PROMETHEUS_SCRAPE_ENABLED: "true"

---
# Backend Deployment - 3 replicas for geographic redundancy
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: danger-emergence
  labels:
    app: backend
    tier: api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # Zero-downtime deployments
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        tier: api
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - backend
              topologyKey: "kubernetes.io/hostname"
      containers:
      - name: backend
        image: dangeremergence/backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 8081
          name: actuator
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secrets
        env:
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://localhost:4317"
        - name: OTEL_TRACES_SAMPLER
          value: "parentbased_traceidratio"
        - name: OTEL_TRACES_SAMPLER_ARG
          value: "0.1"
        - name: OTEL_SERVICE_NAME
          value: "danger-emergence-backend"
        - name: JAVA_TOOL_OPTIONS
          value: "-javaagent:/otel/opentelemetry-javaagent.jar -Dotel.metrics.exporter=prometheus -Dotel.logs.exporter=none"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8081
          initialDelaySeconds: 20
          periodSeconds: 5
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 30
        volumeMounts:
        - name: otel-agent
          mountPath: /otel
      - name: otel-collector
        image: otel/opentelemetry-collector-contrib:0.96.0
        imagePullPolicy: IfNotPresent
        args:
        - "--config=/etc/otel/config.yaml"
        ports:
        - containerPort: 4317
          name: otlp-grpc
        - containerPort: 4318
          name: otlp-http
        - containerPort: 8888
          name: metrics
        - containerPort: 8889
          name: prometheus
        env:
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.name=danger-emergence-backend,service.version=1.0.0,deployment.environment=production"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        volumeMounts:
        - name: otel-collector-config
          mountPath: /etc/otel
      volumes:
      - name: otel-agent
        emptyDir: {}
      - name: otel-collector-config
        configMap:
          name: otel-collector-config

---
# ML Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-service
  namespace: danger-emergence
  labels:
    app: ml-service
    tier: ai
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    maxUnavailable: 0
  selector:
    matchLabels:
      app: ml-service
  template:
    metadata:
      labels:
        app: ml-service
        tier: ai
    spec:
      containers:
      - name: ml-service
        image: dangeremergence/ml-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: REDIS_PORT
        resources:
          requests:
            memory: "2Gi"
            cpu: "1"
            nvidia.com/gpu: 1  # GPU for ML inference
          limits:
            memory: "4Gi"
            cpu: "2"
            nvidia.com/gpu: 1
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30

---
# PostgreSQL Primary (Write)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-primary
  namespace: danger-emergence
spec:
  serviceName: postgres-primary
  replicas: 1
  selector:
    matchLabels:
      app: postgres
      role: primary
  template:
    metadata:
      labels:
        app: postgres
        role: primary
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "danger_emergence"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DB_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DB_PASSWORD
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "1"
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: "ssd"
      resources:
        requests:
          storage: 100Gi

---
# PostgreSQL Read Replica (for scaling reads)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-replica
  namespace: danger-emergence
spec:
  serviceName: postgres-replica
  replicas: 2
  selector:
    matchLabels:
      app: postgres
      role: replica
  template:
    metadata:
      labels:
        app: postgres
        role: replica
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "danger_emergence"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DB_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DB_PASSWORD
        - name: POSTGRES_PRIMARY_HOST
          value: "postgres-primary"
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "1"

---
# Redis Cluster
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: danger-emergence
spec:
  replicas: 3
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        args: ["--appendonly", "yes", "--save", "60", "1"]
        volumeMounts:
        - name: redis-data
          mountPath: /data
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
      volumes:
      - name: redis-data
        emptyDir: {}

---
# Mosquitto MQTT Broker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: danger-emergence
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      containers:
      - name: mosquitto
        image: eclipse-mosquitto:2
        ports:
        - containerPort: 1883
          name: mqtt
        - containerPort: 9001
          name: ws
        volumeMounts:
        - name: config
          mountPath: /mosquitto/config/mosquitto.conf
          subPath: mosquitto.conf
      volumes:
      - name: config
        configMap:
          name: mosquitto-config

---
# Nginx Ingress
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: danger-emergence
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        - containerPort: 443
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d
        - name: ssl-certs
          mountPath: /etc/nginx/ssl
          readOnly: true
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config
      - name: ssl-certs
        secret:
          secretName: ssl-certs

---
# Services
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: danger-emergence
spec:
  selector:
    app: backend
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  - port: 8081
    targetPort: 8081
    name: actuator

---
apiVersion: v1
kind: Service
metadata:
  name: ml-service
  namespace: danger-emergence
spec:
  selector:
    app: ml-service
  ports:
  - port: 8000
    targetPort: 8000

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-primary
  namespace: danger-emergence
spec:
  selector:
    app: postgres
    role: primary
  ports:
  - port: 5432

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-replica
  namespace: danger-emergence
spec:
  selector:
    app: postgres
    role: replica
  ports:
  - port: 5432

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: danger-emergence
spec:
  selector:
    app: redis
  ports:
  - port: 6379

---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: danger-emergence
spec:
  selector:
    app: mosquitto
  ports:
  - port: 1883
    name: mqtt
  - port: 9001
    name: ws

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: danger-emergence
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
# Pod Disruption Budget (ensure minimum availability)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-pdb
  namespace: danger-emergence
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: backend

---
# Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-network-policy
  namespace: danger-emergence
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: nginx
    ports:
    - port: 8080
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - port: 6379
  - to:
    - podSelector:
        matchLabels:
          app: ml-service
    ports:
    - port: 8000
  - to:
    - podSelector:
        matchLabels:
          app: otel-collector
    ports:
    - port: 4317
    - port: 8888

---
# OpenTelemetry Collector ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: danger-emergence
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch:
        timeout: 5s
        send_batch_size: 512
        send_batch_max_size: 2048
      memory_limiter:
        check_interval: 1s
        limit_mib: 200
        spike_limit_mib: 50
      attributes:
        actions:
        - key: deployment.environment
          value: production
          action: upsert
        - key: service.version
          value: 1.0.0
          action: upsert
      filter:
        error_mode: ignore
        traces:
          span:
          - 'attributes["http.method"] == "OPTIONS"'
    exporters:
      otlp:
        endpoint: "api.honeycomb.io:443"
        headers:
          "x-honeycomb-team": "${HONEYCOMB_API_KEY}"
          "x-honeycomb-dataset": "danger-emergence-prod"
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "danger_emergence"
        const_labels:
          environment: production
          service: backend
      logging:
        verbosity: detailed
        sampling_initial: 5
        sampling_thereafter: 100
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch, attributes, filter]
          exporters: [otlp, logging]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch, attributes]
          exporters: [prometheus, logging]

---
# OpenTelemetry Collector Service
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: danger-emergence
  labels:
    app: otel-collector
spec:
  selector:
    app: backend
  ports:
  - port: 4317
    targetPort: 4317
    name: otlp-grpc
  - port: 4318
    targetPort: 4318
    name: otlp-http
  - port: 8888
    targetPort: 8888
    name: internal-metrics
  - port: 8889
    targetPort: 8889
    name: prometheus

---
# Prometheus ServiceMonitor
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend-monitor
  namespace: danger-emergence
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: backend
  namespaceSelector:
    matchNames:
    - danger-emergence
  endpoints:
  - port: actuator
    interval: 15s
    path: /actuator/prometheus
    scrapeTimeout: 10s
    metricRelabelings:
    - sourceLabels: [__name__]
      regex: '(emergency_sos_processing_time_seconds|emergency_mesh_messages_total|emergency_drone_telemetry_total|emergency_inference_latency_milliseconds|emergency_websocket_connections|emergency_battery_critical_total|jvm_memory_used_bytes|jvm_gc_pause_seconds|http_server_requests_seconds)'
      action: keep
  - port: prometheus
    interval: 15s
    path: /metrics
    scrapeTimeout: 10s

---
# Grafana Dashboard ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: danger-emergence
  labels:
    grafana_dashboard: "1"
data:
  emergency-system-overview.json: |
    {
      "__inputs": [],
      "__requires": [],
      "title": "Danger Emergence System - Production Overview",
      "version": 1,
      "panels": [
        {
          "title": "SOS Processing Latency (p50/p95/p99)",
          "type": "graph",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "emergency_sos_processing_time_seconds{quantile=\"0.5\"}",
              "legendFormat": "p50"
            },
            {
              "expr": "emergency_sos_processing_time_seconds{quantile=\"0.95\"}",
              "legendFormat": "p95"
            },
            {
              "expr": "emergency_sos_processing_time_seconds{quantile=\"0.99\"}",
              "legendFormat": "p99"
            }
          ],
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
        },
        {
          "title": "Mesh Network Throughput",
          "type": "graph",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "rate(emergency_mesh_messages_total[5m])",
              "legendFormat": "msgs/s"
            }
          ],
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}
        },
        {
          "title": "Drone Telemetry Rate",
          "type": "graph",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "rate(emergency_drone_telemetry_total[5m])",
              "legendFormat": "telemetry/s"
            }
          ],
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}
        },
        {
          "title": "Inference Latency Distribution",
          "type": "heatmap",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "emergency_inference_latency_milliseconds_bucket",
              "format": "heatmap"
            }
          ],
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}
        },
        {
          "title": "Active WebSocket Connections",
          "type": "graph",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "emergency_websocket_connections",
              "legendFormat": "connections"
            }
          ],
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16}
        },
        {
          "title": "JVM Memory Usage",
          "type": "graph",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "jvm_memory_used_bytes{area=\"heap\"}",
              "legendFormat": "heap"
            },
            {
              "expr": "jvm_memory_used_bytes{area=\"nonheap\"}",
              "legendFormat": "non-heap"
            }
          ],
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16}
        },
        {
          "title": "Battery Critical Alerts (cumulative)",
          "type": "stat",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "emergency_battery_critical_total",
              "legendFormat": "total"
            }
          ],
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 24}
        },
        {
          "title": "HTTP Request Rate & Error Rate",
          "type": "graph",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "rate(http_server_requests_seconds_count{status=~\"2..\"}[5m])",
              "legendFormat": "2xx"
            },
            {
              "expr": "rate(http_server_requests_seconds_count{status=~\"5..\"}[5m])",
              "legendFormat": "5xx"
            }
          ],
          "gridPos": {"h": 8, "w": 12, "x": 6, "y": 24}
        }
      ],
      "tags": ["emergency", "production", "danger-emergence"],
      "schemaVersion": 36
    }

---
# PrometheusRule for Alerting
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: backend-alerts
  namespace: danger-emergence
  labels:
    release: prometheus
spec:
  groups:
  - name: backend.rules
    rules:
    - alert: HighSOSLatency
      expr: emergency_sos_processing_time_seconds{quantile="0.95"} > 5
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "SOS processing latency above 5s (p95)"
        description: "SOS alert processing p95 latency is {{ $value }}s for 5 minutes"
    - alert: HighMeshTraffic
      expr: rate(emergency_mesh_messages_total[5m]) > 1000
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Mesh network traffic exceeds 1000 msgs/s"
        description: "Mesh message rate is {{ $value }} msgs/s"
    - alert: DroneTelemetryLoss
      expr: rate(emergency_drone_telemetry_total[5m]) < 1
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Drone telemetry rate dropped below 1/s"
        description: "Drone telemetry rate is {{ $value }} telemetry/s"
    - alert: HighInferenceLatency
      expr: emergency_inference_latency_milliseconds{quantile="0.99"} > 1000
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "ML inference p99 latency above 1s"
        description: "Inference p99 latency is {{ $value }}ms"
    - alert: WebSocketConnectionDrop
      expr: emergency_websocket_connections < 1
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "No active WebSocket connections"
        description: "WebSocket connections dropped to {{ $value }}"
    - alert: HighMemoryUsage
      expr: jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} > 0.85
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "JVM heap usage above 85%"
        description: "Heap usage is {{ $value | humanizePercentage }}"
    - alert: BatteryCriticalAlert
      expr: rate(emergency_battery_critical_total[5m]) > 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Battery critical alerts detected"
        description: "Battery critical events occurring at {{ $value }} events/s"
