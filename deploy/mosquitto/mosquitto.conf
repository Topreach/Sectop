# Mosquitto MQTT Broker Configuration for Danger Emergence System

# Network
listener 1883
protocol mqtt

listener 9001
protocol websockets

# Security
allow_anonymous true

# Persistence
persistence true
persistence_location /var/lib/mosquitto/

# Logging
log_dest file /var/log/mosquitto/mosquitto.log
log_type all
connection_messages true
log_timestamp true

# Authentication (optional - enable for production)
# password_file /etc/mosquitto/passwd
# allow_anonymous false

# Access Control (optional - enable for production)
# acl_file /etc/mosquitto/acl

# QoS and Message Limits
max_inflight_messages 20
max_queued_messages 1000
queue_qos0_messages true

# Session Management
persistent_client_expiration 1d
set_tcp_nodelay true

# Topic Hierarchy:
# danger-emergence/{userId}/sos        - SOS alerts
# danger-emergence/{userId}/message    - Direct messages
# danger-emergence/{userId}/location   - Location updates
# danger-emergence/{userId}/status     - User status
# danger-emergence/broadcast/alert     - Broadcast alerts
# danger-emergence/broadcast/zone      - Zone updates
# danger-emergence/system/health       - System health checks
