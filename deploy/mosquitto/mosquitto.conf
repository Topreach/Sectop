# Mosquitto MQTT Broker Configuration for Danger Emergence System
# PRODUCTION CONFIGURATION — Authentication enabled

# Network
listener 1883
protocol mqtt

listener 9001
protocol websockets

# TLS listener (recommended for production)
# listener 8883
# protocol mqtt
# certfile /etc/mosquitto/certs/server.crt
# keyfile /etc/mosquitto/certs/server.key

# Security — Authentication REQUIRED
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

# Persistence
persistence true
persistence_location /var/lib/mosquitto/

# Logging
log_dest file /var/log/mosquitto/mosquitto.log
log_type all
connection_messages true
log_timestamp true

# Authentication (enabled for production)
# To generate password file:
#   mosquitto_passwd -c /etc/mosquitto/passwd <username>
# For each additional user:
#   mosquitto_passwd /etc/mosquitto/passwd <username>

# Access Control
# acl_file /etc/mosquitto/acl — see ACL template below

# QoS and Message Limits
max_inflight_messages 20
max_queued_messages 1000
queue_qos0_messages true

# Session Management
persistent_client_expiration 1d
set_tcp_nodelay true

# Rate Limiting
max_connections 1000
max_keepalive 65535

# Topic Hierarchy:
# danger-emergence/{userId}/sos        - SOS alerts
# danger-emergence/{userId}/message    - Direct messages
# danger-emergence/{userId}/location   - Location updates
# danger-emergence/{userId}/status     - User status
# danger-emergence/broadcast/alert     - Broadcast alerts
# danger-emergence/broadcast/zone      - Zone updates
# danger-emergence/system/health       - System health checks
