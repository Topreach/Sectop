server {
    listen 443 ssl;
    server_name sectop.resultscaleai.com;

    ssl_certificate /etc/nginx/ssl/resultscaleai.crt;
    ssl_certificate_key /etc/nginx/ssl/resultscaleai.key;

    # Frontend - proxy through Docker Nginx on port 8088
    location / {
        proxy_pass http://localhost:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SOS Alert API - routes to SOS microservice on port 8081 (MUST be before /api/)
    location /api/v1/alerts {
        proxy_pass http://localhost:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # API - proxy through Docker Nginx on port 8088
    location /api/ {
        proxy_pass http://localhost:8088/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SOS WebSocket - routes to SOS microservice on port 8081 (MUST be before /ws/)
    location /ws-sos {
        proxy_pass http://localhost:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # WebSocket - proxy through Docker Nginx on port 8088
    location /ws/ {
        proxy_pass http://localhost:8088/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # ML Service - direct to ml-service
    location /ml/ {
        proxy_pass http://localhost:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Account Deletion page (required by Google Play)
    location = /account-deletion {
        root /var/www/sites/Sectop;
        try_files /account-deletion.html =404;
    }
}
