services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: danger-emergence-db
    environment:
      POSTGRES_DB: danger_emergence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD} # REQUIRED: Must be set in .env file
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - danger-emergence-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: danger-emergence-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - danger-emergence-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # MQTT Broker for IoT/Mesh communication
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: danger-emergence-mqtt
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
      - mosquitto_config:/mosquitto/config
    networks:
      - danger-emergence-network
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$SYS/#' -C 1 --quiet 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: danger-emergence-backend
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD} # REQUIRED: Must be set in .env file
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JDBC_DATABASE_URL: jdbc:postgresql://danger-emergence-db:5432/danger_emergence
      ML_SERVICE_URL: http://ml-service:8000
      ML_API_KEY: ${ML_API_KEY:-}
      MQTT_BROKER: tcp://mosquitto:1883
      JWT_SECRET: ${JWT_SECRET} # REQUIRED: Must be set in .env file
      MAIL_USERNAME: ${MAIL_USERNAME} # REQUIRED for password reset
      MAIL_PASSWORD: ${MAIL_PASSWORD} # REQUIRED for password reset
      APP_BASE_URL: ${APP_BASE_URL} # REQUIRED for password reset email links
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || curl --fail http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - danger-emergence-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # SOS Microservice (Port 8081) - Dedicated SOS alert processing
  sos-service:
    build:
      context: ./sos-service
      dockerfile: Dockerfile
    container_name: danger-emergence-sos
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JDBC_DATABASE_URL: jdbc:postgresql://danger-emergence-db:5432/danger_emergence
      MQTT_BROKER: tcp://mosquitto:1883
      JWT_SECRET: ${JWT_SECRET}
      FCM_SERVER_KEY: ${FCM_SERVER_KEY:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health || curl --fail http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - danger-emergence-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # FastAPI ML Service
  ml-service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    container_name: danger-emergence-ml
    environment:
      MODEL_NAME: ${MODEL_NAME:-facebook/bart-large-mnli}
      ML_API_KEY: ${ML_API_KEY:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8000/health || curl --fail http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - danger-emergence-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  # Nginx Reverse Proxy
  nginx:
    build:
      context: ./deploy/nginx
      dockerfile: Dockerfile
    container_name: danger-emergence-nginx
    ports:
      - "8088:80"
    volumes: []
    depends_on:
      - backend
      - sos-service
      - ml-service
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/api/v1/zones/count || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - danger-emergence-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

networks:
  danger-emergence-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  mosquitto_data:
  mosquitto_log:
  mosquitto_config:
