services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: danger-emergence-db
    environment:
      POSTGRES_DB: danger_emergence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - danger-emergence-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: danger-emergence-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - danger-emergence-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MQTT Broker for IoT/Mesh communication
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: danger-emergence-mqtt
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
      - mosquitto_config:/mosquitto/config
    networks:
      - danger-emergence-network
    restart: unless-stopped

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: danger-emergence-backend
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ML_SERVICE_URL: http://ml-service:8000
      MQTT_BROKER: tcp://mosquitto:1883
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-service:
        condition: service_started
    networks:
      - danger-emergence-network
    restart: unless-stopped

  # FastAPI ML Service
  ml-service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    container_name: danger-emergence-ml
    environment:
      MODEL_NAME: ${MODEL_NAME:-facebook/bart-large-mnli}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - danger-emergence-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: danger-emergence-nginx
    ports:
      - "8081:80"
    volumes:
      - nginx_config:/etc/nginx
      - nginx_html:/usr/share/nginx/html
    depends_on:
      - backend
      - ml-service
    networks:
      - danger-emergence-network
    restart: unless-stopped

networks:
  danger-emergence-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  mosquitto_data:
  mosquitto_log:
  mosquitto_config:
  nginx_config:
  nginx_html:
