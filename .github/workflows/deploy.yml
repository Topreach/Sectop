name: Danger Emergence System - Production Pipeline

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}/backend
  IMAGE_NAME_FRONTEND: ${{ github.repository }}/frontend
  K8S_NAMESPACE: danger-emergence

jobs:
  # ========== STAGE 1: LINT & TEST ==========
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      
      # Backend tests
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
      
      - name: Run backend tests with coverage
        run: |
          cd backend
          mvn clean verify jacoco:report
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/target/site/jacoco/jacoco.xml
          flags: backend
      
      # Frontend tests
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
      
      - name: Install frontend dependencies
        run: |
          cd frontend
          flutter pub get
      
      - name: Run frontend tests
        run: |
          cd frontend
          flutter test --coverage
      
      - name: Upload frontend coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend
      
      # Security scan
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  # ========== STAGE 2: BUILD & PUSH ==========
  build-and-push:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      # Log in to GHCR
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      # Build and push backend
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      # Build and push frontend
      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      # Build and push ML service
      - name: Build and push ML Service
        uses: docker/build-push-action@v5
        with:
          context: ./ml_service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/ml-service:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/ml-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========== STAGE 3: CANARY DEPLOY ==========
  canary-deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: canary
    steps:
      - uses: actions/checkout@v4
      
      # Configure kubectl
      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.K8S_CANARY_CONFIG }}" | base64 --decode > $HOME/.kube/config
      
      # Deploy canary with 10% traffic
      - name: Deploy Canary
        run: |
          # Apply canary-specific config
          kubectl -n ${{ env.K8S_NAMESPACE }} apply -f deploy/k8s/canary.yaml
          
          # Wait for canary pods to be ready
          kubectl -n ${{ env.K8S_NAMESPACE }} wait --for=condition=ready pod -l app=backend-canary --timeout=300s
          
          # Split traffic: 10% canary, 90% stable
          kubectl -n ${{ env.K8S_NAMESPACE }} patch service backend -p '{"spec":{"selector":{"app":"backend"}}}'
      
      # Run smoke tests on canary
      - name: Smoke Test Canary
        run: |
          ./deploy/scripts/smoke-test.sh canary.dangeremergence.com
      
      # Monitor for 10 minutes
      - name: Monitor Canary (10 min)
        run: |
          echo "Monitoring canary deployment..."
          sleep 600
          
          # Check error rate threshold
          ERROR_RATE=$(curl -s https://prometheus.dangeremergence.com/api/v1/query?query=rate(http_requests_total{app=\"backend-canary\",status=~\"5..\"}[5m]) | jq -r '.data.result[0].value[1]')
          
          if (( $(echo "$ERROR_RATE > 0.01" | bc -l) )); then
            echo "Error rate >1%, aborting rollout"
            exit 1
          fi
      
      # Promote if healthy
      - name: Promote Canary
        if: success()
        run: |
          kubectl -n ${{ env.K8S_NAMESPACE }} patch service backend -p '{"spec":{"selector":{"app":"backend"}}}'
          echo "CANARY_PROMOTED=true" >> $GITHUB_ENV

  # ========== STAGE 4: ROLLING UPDATE ==========
  rolling-update:
    needs: canary-deploy
    if: success() && needs.canary-deploy.outputs.CANARY_PROMOTED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.K8S_PROD_CONFIG }}" | base64 --decode > $HOME/.kube/config
      
      # Update image tags
      - name: Update Kubernetes manifests
        run: |
          cd deploy/k8s
          kustomize edit set image backend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}
          kustomize edit set image frontend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}
      
      # Rolling update with max surge
      - name: Apply rolling update
        run: |
          kubectl -n ${{ env.K8S_NAMESPACE }} apply -k deploy/k8s/
          
          # Wait for rollout to complete
          kubectl -n ${{ env.K8S_NAMESPACE }} rollout status deployment/backend --timeout=10m
          kubectl -n ${{ env.K8S_NAMESPACE }} rollout status deployment/frontend --timeout=5m
      
      # Post-deployment validation
      - name: Validate deployment
        run: |
          ./deploy/scripts/validate-deployment.sh

  # ========== STAGE 5: CLEANUP ==========
  cleanup:
    needs: rolling-update
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.K8S_PROD_CONFIG }}" | base64 --decode > $HOME/.kube/config
      
      - name: Remove canary resources
        run: |
          kubectl -n ${{ env.K8S_NAMESPACE }} delete -f deploy/k8s/canary.yaml --ignore-not-found
      
      - name: Notify on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.24
        with:
          payload: |
            {
              "text": "🚨 Deployment failed! Check GitHub Actions for details.",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "❌ *Deployment Failed*\nWorkflow: ${{ github.workflow }}\nCommit: ${{ github.sha }}\nAuthor: ${{ github.actor }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
