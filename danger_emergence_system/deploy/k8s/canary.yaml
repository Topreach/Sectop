# Canary deployment with 10% traffic
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-canary
  namespace: danger-emergence
  labels:
    app: backend-canary
    version: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-canary
  template:
    metadata:
      labels:
        app: backend-canary
        version: canary
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
      - name: backend
        image: ghcr.io/dangeremergence/backend:latest  # Will be replaced
        ports:
        - containerPort: 8080
        env:
        - name: OTEL_TRACES_SAMPLER
          value: "parentbased_traceidratio"
        - name: OTEL_TRACES_SAMPLER_ARG
          value: "0.5"  # 50% sampling for canary
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector:4317"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
---
# Service with split traffic (using Istio or similar)
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: backend-canary-vs
  namespace: danger-emergence
spec:
  hosts:
  - backend
  http:
  - match:
    - headers:
        x-canary:
          exact: "true"
    route:
    - destination:
        host: backend-canary
        port:
          number: 8080
      weight: 100
  - route:
    - destination:
        host: backend
        port:
          number: 8080
      weight: 90
    - destination:
        host: backend-canary
        port:
          number: 8080
      weight: 10
