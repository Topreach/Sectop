pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // AGP must be declared here so app/build.gradle can resolve com.android.application.
    // The Flutter Gradle plugin (included via includeBuild) provides the actual
    // AGP implementation, but the plugin declaration is still needed for resolution.
    id "com.android.application" version "8.11.1" apply false
    // com.android.library is needed by plugin subprojects (e.g. background_fetch)
    // that use the library plugin in their own build.gradle files.
    id "com.android.library" version "8.11.1" apply false
    id "org.jetbrains.kotlin.android" version "2.0.21" apply false
}

include ":app"
