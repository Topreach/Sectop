name: danger_emergence_system
description: An offline-first emergency communication and response application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # Local Storage
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Offline Maps
  mapbox_gl: ^0.16.0
  
  # Communication
  flutter_bluetooth_serial: ^0.4.0
  wifi_iot: ^0.3.18
  
  # UI Components
  flutter_local_notifications: ^16.3.2
  flutter_svg: ^2.0.9
  lottie: ^2.7.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.0
  
  # Utilities
  connectivity_plus: ^5.0.2
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  permission_handler: ^11.1.0
  intl: ^0.18.1
  uuid: ^4.2.1
  crypto: ^3.0.3
  pointycastle: ^3.7.3
  http: ^1.1.2
  web_socket_channel: ^2.4.0
  json_annotation: ^4.8.1
  
  # AI/ML (native-only, web uses fallback rule-based analysis)
  tflite_flutter: ^0.9.0
  tflite_flutter_helper: ^0.3.1

  # Drone Computer Vision (pinned to match tflite_flutter_helper transitive requirement)
  image: ^3.0.2

  # Background Services
  workmanager: ^0.5.2
  background_fetch: ^1.2.1

  # Collections (LRU cache, priority queues)
  collection: ^1.18.0

  # Digital Twin - 3D Rendering
  # cesium_3d_tiles: ^0.8.0  # Uncomment when package is available
  vector_math: ^2.1.4

  # Digital Twin - AR Capabilities
  # arkit_plugin: ^0.7.0   # Uncomment for iOS AR
  # arcore_plugin: ^0.4.0  # Uncomment for Android AR

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1
  mockito: ^5.4.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/models/
    - assets/data/
    - assets/animations/
  
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
