name: danger_emergence_system
description: An offline-first emergency communication and response application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # Local Storage
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Communication
  flutter_bluetooth_serial: ^0.4.0
  wifi_iot: ^0.3.18
  
  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  
  # UI Components
  flutter_local_notifications: ^16.3.2
  flutter_svg: ^2.0.9
  lottie: ^2.7.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.0
  
  # Utilities
  connectivity_plus: ^5.0.2
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  permission_handler: ^11.1.0
  intl: ^0.18.1
  uuid: ^4.2.1
  crypto: ^3.0.3
  pointycastle: ^3.7.3
  http: ^1.1.2
  web_socket_channel: ^2.4.0
  json_annotation: ^4.8.1

  # Evidence Collection
  image_picker: ^1.0.4
  record: ^4.0.0
  video_player: ^2.8.1

  # Real-time Delivery (WebSocket/STOMP)
  # Using raw web_socket_channel instead of stomp_dart_client (pub cache corruption on build server)

  # Push Notifications
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.10
  # AI/ML
  # NOTE: tflite_flutter and tflite_flutter_helper are intentionally removed.
  # These Flutter plugins bundle native .so libraries that cause
  # UnsatisfiedLinkError during Flutter engine initialization on devices
  # with incompatible ABIs. TFLite inference is performed via native
  # Kotlin MethodChannel bridge (see SecurityProvider.kt) which uses
  # the Android TFLite runtime from build.gradle dependencies.
  image: ^3.0.2

  # Background Services
  workmanager: ^0.5.2
  background_fetch: ^1.2.1

  # Collections (LRU cache, priority queues)
  collection: ^1.18.0

  # Digital Twin - 3D Rendering
  # cesium_3d_tiles: ^0.8.0  # Uncomment when package is available
  vector_math: ^2.1.4

  # Digital Twin - AR Capabilities
  # arkit_plugin: ^0.7.0   # Uncomment for iOS AR
  # arcore_plugin: ^0.4.0  # Uncomment for Android AR

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1
  mockito: ^5.4.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/models/
    - assets/data/
    - assets/animations/
